# Spring Application Name
spring.application.name=FullTank Platform

# Default to development when no explicit profile is provided.
spring.profiles.default=dev

# Shared Spring DataSource Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Shared Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.naming.physical-strategy=com.primefuel.fulltank.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Schema migrations (Flyway). Disabled until T03-B replaces startup DDL with validate + V1 baseline.
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

# Application Information for Documentation
documentation.application.description=@project.description@
documentation.application.version=@project.version@
documentation.application.server-url=${SERVER_URL:http://localhost:8080}

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

# JWT Configuration Properties
authorization.jwt.secret=${AUTHORIZATION_JWT_SECRET}
authorization.jwt.expiration.days=7

# Password recovery email. Configure SMTP_HOST, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD and MAIL_FROM.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
app.password-reset.link=${PASSWORD_RESET_LINK:fulltank:///reset-password}
app.password-reset.from=${MAIL_FROM:no-reply@fulltank.app}

# i18n message bundles
spring.messages.basename=messages
spring.messages.encoding=UTF-8
