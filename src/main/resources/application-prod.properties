# Production profile (Render + Aiven MySQL). Activate with SPRING_PROFILES_ACTIVE=prod
spring.datasource.url=jdbc:mysql://${DATABASE_URL}:${DATABASE_PORT:3306}/${DATABASE_NAME:defaultdb}?sslMode=REQUIRED&serverTimezone=UTC
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DATABASE_MAX_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=${DATABASE_MIN_IDLE:1}

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Schema migrations (Flyway owns DDL; runtime only validates)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Render injects PORT
server.port=${PORT:8080}
